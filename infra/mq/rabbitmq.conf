# =====================================================================
# Configuración RabbitMQ - RutaExpress
# =====================================================================

# Usuario y Credenciales por Defecto
default_user = guest
default_pass = guest
default_vhost = /

# Permitir acceso del usuario guest desde cualquier IP (necesario en contenedores)
loopback_users.guest = false
loopback_users = none

# Carga automática de la topología declarativa (Exchanges, Queues, Bindings)
load_definitions = /etc/rabbitmq/definitions.json

# Límites de memoria y disco
vm_memory_high_watermark.relative = 0.8
disk_free_limit.relative = 1.0
