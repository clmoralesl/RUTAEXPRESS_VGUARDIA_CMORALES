# ==============================================================================
# Orquestacion de Microservicios y Frontend - Ecosistema RutaExpress
# ==============================================================================
services:

  # ----------------------------------------------------------------------------
  # Backend For Frontend (BFF) - Resource Server OAuth2 / Azure AD
  # ----------------------------------------------------------------------------
  ms-rutaexpress-bff:
    build:
      context: ../../ms-rutaexpress-bff
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-bff
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - RUTAEXPRESS_NOTIFICACIONES_URL=http://ms-rutaexpress-notificaciones:8083
      - RUTAEXPRESS_CATALOGO_URL=http://ms-rutaexpress-catalogo:8082
      - RUTAEXPRESS_ENVIOS_URL=http://ms-rutaexpress-envios:8081
      - RUTAEXPRESS_AUDITORIA_URL=http://ms-rutaexpress-auditoria:8084
      - RUTAEXPRESS_REPORTES_URL=http://ms-rutaexpress-reportes:8086
    networks:
      - rutaexpress-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Frontend Angular 20 (Servido mediante Nginx con Reverse Proxy)
  # ----------------------------------------------------------------------------
  rutaexpress-frontend:
    build:
      context: ../../rutaexpress-frontend
      dockerfile: Dockerfile
    container_name: rutaexpress-frontend
    ports:
      - "4200:80"
    depends_on:
      - ms-rutaexpress-bff
    networks:
      - rutaexpress-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Microservicio de Gestion de Envios
  # ----------------------------------------------------------------------------
  ms-rutaexpress-envios:
    build:
      context: ../../ms-rutaexpress-envios
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-envios
    ports:
      - "8081:8081"
    env_file:
      - ../../.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8081
      - CATALOGO_SERVICE_URL=http://ms-rutaexpress-catalogo:8082
    volumes:
      - ../oracle/wallet:/opt/oracle/wallet:ro
    networks:
      - rutaexpress-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Microservicio de Catalogo de Servicios y Flota
  # ----------------------------------------------------------------------------
  ms-rutaexpress-catalogo:
    build:
      context: ../../ms-rutaexpress-catalogo
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-catalogo
    ports:
      - "8082:8082"
    env_file:
      - ../../.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8082
    volumes:
      - ../oracle/wallet:/opt/oracle/wallet:ro
    networks:
      - rutaexpress-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Microservicio de Notificaciones y Tickets Bodega (Consumidor RabbitMQ)
  # ----------------------------------------------------------------------------
  ms-rutaexpress-notificaciones:
    build:
      context: ../../ms-rutaexpress-notificaciones
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-notificaciones
    ports:
      - "8083:8083"
    env_file:
      - ../../.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8083
    networks:
      - rutaexpress-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Microservicio de Auditoria (Consumidor Kafka, Timeline Inmutable)
  # ----------------------------------------------------------------------------
  ms-rutaexpress-auditoria:
    build:
      context: ../../ms-rutaexpress-auditoria
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-auditoria
    ports:
      - "8084:8084"
    env_file:
      - ../../.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8084
    volumes:
      - ../oracle/wallet:/opt/oracle/wallet:ro
    networks:
      - rutaexpress-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Microservicio de Reportes y KPIs (Consumidor Kafka y Motor Analitico)
  # ----------------------------------------------------------------------------
  ms-rutaexpress-reportes:
    build:
      context: ../../ms-rutaexpress-reportes
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-reportes
    ports:
      - "8086:8086"
    env_file:
      - ../../.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8086
    networks:
      - rutaexpress-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Proxy Inverso Nginx con HTTPS (Fachada Same-Origin y Contexto Seguro MSAL)
  # ----------------------------------------------------------------------------
  rutaexpress-nginx-proxy:
    image: nginx:1.27-alpine
    container_name: rutaexpress-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - ms-rutaexpress-bff
      - rutaexpress-frontend
    networks:
      - rutaexpress-network
    restart: unless-stopped

networks:
  rutaexpress-network:
    driver: bridge
