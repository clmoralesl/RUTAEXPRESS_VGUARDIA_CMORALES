# ==============================================================================
# Orquestacion Nginx Proxy Inverso con HTTPS (RutaExpress)
# ==============================================================================
services:
  rutaexpress-nginx-proxy:
    image: nginx:1.27-alpine
    container_name: rutaexpress-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - rutaexpress-network

networks:
  rutaexpress-network:
    name: rutaexpress-network
    driver: bridge
